name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java for Android SDK tools
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools platforms;android-28 build-tools;30.0.3'
          log-accepted-android-sdk-licenses: false

      # Gradle 6.7.1 and Android Gradle Plugin 4.2.2 require an older JDK.
      - name: Set up Java for Gradle
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:assembleNoPrefixDebug :app:testNoPrefixDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-converter-debug
          path: app/build/outputs/apk/noPrefix/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Restore release signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleNoPrefixRelease

      - name: Verify release version and APK signature
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path('app/build/outputs/apk/noPrefix/release/output-metadata.json').read_text())
          version = metadata['elements'][0]['versionName']
          if os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit(f'Tag must match the APK version: v{version}')
          PY
          "$ANDROID_HOME/build-tools/30.0.3/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/noPrefix/release/app-noPrefix-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/noPrefix/release/app-noPrefix-release.apk "dist/unit-converter-${GITHUB_REF_NAME}.apk"
          cd dist
          sha256sum ./*.apk > SHA256SUMS

      - name: Remove release signing key
        if: always() && startsWith(github.ref, 'refs/tags/')
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Upload release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-converter-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-converter-release
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'NOTES'
          Download the signed APK below and install it on your Android device (Android 4.0.3 or newer).

          This release uses a new GitHub Releases signing key, which will also sign future releases. Updating an older Google Play installation may require uninstalling it first; export any custom converters before uninstalling.

          Verify the downloaded APK with the attached SHA256SUMS file.
          NOTES
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag --title "Unit Converter $GITHUB_REF_NAME" \
              --notes-file release-notes.md --generate-notes
          fi
